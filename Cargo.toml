[workspace]
resolver = "3"
members = ["crates/scrume-core", "apps/service", "apps/lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
ipnet = { version = "=2.11.0", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["serde"] }
windows-service = "=0.8.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
