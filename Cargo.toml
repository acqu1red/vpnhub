[workspace]
resolver = "3"
members = ["crates/scrume-core", "crates/scrume-windows", "apps/service", "apps/lab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
ipnet = { version = "=2.11.0", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["serde"] }
windows-service = "=0.8.0"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Memory", "Win32_System_Com", "Win32_UI_Shell"] }
zeroize = "=1.9.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
